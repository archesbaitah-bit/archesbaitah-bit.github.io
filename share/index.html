<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening Cartly…</title>
<style>
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#023723; color:#fff; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .card { text-align:center; padding:32px 24px; max-width:420px; }
  h1 { font-size:22px; margin:0 0 10px; }
  p { color:#cfe3d8; font-size:15px; line-height:1.5; margin:0 0 22px; }
  a.btn { display:inline-block; background:#FD5500; color:#fff; font-weight:700; font-size:17px; text-decoration:none; padding:14px 34px; border-radius:12px; }
  .fine { margin-top:26px; font-size:12px; color:#8fb3a1; }
</style>
</head>
<body>
  <div class="card">
    <h1>Opening Cartly…</h1>
    <p id="msg">Taking you to the product in Cartly. If it does not open automatically, tap the button below.</p>
    <a class="btn" id="openBtn" href="com.numnum.app.grocery-prices-app://share">Open in Cartly</a>
    <p class="fine">This page does not store or track what you shared.</p>
  </div>
<script>
  function buildTarget(hash) {
    var base = 'com.numnum.app.grocery-prices-app://share';
    var q = (hash || '').replace(/^#/, '');
    return q ? base + '?' + q : base;
  }
  var target = buildTarget(window.location.hash);
  document.getElementById('openBtn').setAttribute('href', target);
  setTimeout(function () { window.location.replace(target); }, 200);
</script>
</body>
</html>
